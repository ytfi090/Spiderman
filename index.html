<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIDER-MAN: THE ULTIMATE EXPERIENCE</title>
    <style>
        :root {
            --red: #ff0015; --blue: #001eff; --white: #f0f0f0; --black: #020205;
        }

        /* --- THE GLITCH OVERLAY --- */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            pointer-events: none; z-index: 9999; opacity: 0.3;
        }

        body {
            background-color: var(--black); color: var(--white);
            font-family: 'Inter', sans-serif; overflow-x: hidden;
            cursor: none; /* We are building a custom web-cursor */
        }

        /* --- THE WEB CURSOR --- */
        #cursor {
            position: fixed; width: 20px; height: 20px; background: var(--white);
            border-radius: 50%; pointer-events: none; z-index: 10000;
            mix-blend-mode: difference; transition: transform 0.1s ease;
        }
        #cursor-web {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9998;
        }

        /* --- SECTIONS & 3D SPACE --- */
        .container { perspective: 1200px; height: 100vh; overflow-y: auto; overflow-x: hidden; }

        section {
            position: relative; height: 100vh; display: flex; align-items: center;
            justify-content: center; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- SECTION 1: THE VOID HERO --- */
        .hero-title {
            font-size: clamp(4rem, 12vw, 15rem); font-weight: 900;
            text-transform: uppercase; line-height: 0.8; text-align: center;
            filter: drop-shadow(5px 5px var(--red)) drop-shadow(-5px -5px var(--blue));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0) rotateX(5deg); } 50% { transform: translateY(-20px) rotateX(-5deg); } }

        /* --- THE SUIT LAB (GALLERY REINVENTED) --- */
        .suit-lab {
            display: flex; gap: 20px; width: 200%; animation: scroll-lab 30s linear infinite;
        }
        @keyframes scroll-lab { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .suit-card {
            width: 300px; height: 450px; background: #111; border: 1px solid var(--red);
            flex-shrink: 0; transform: skewX(-5deg); overflow: hidden;
            position: relative; transition: 0.5s;
        }
        .suit-card:hover { transform: skewX(0deg) scale(1.1); z-index: 10; border-color: var(--blue); }

        .suit-card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: 0.5s; }
        .suit-card:hover img { filter: grayscale(0); }

        /* --- THE SENSE ALERT --- */
        .sense-alert {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            color: yellow; font-weight: bold; font-style: italic; opacity: 0;
            animation: sense-flash 2s infinite; pointer-events: none;
        }
        @keyframes sense-flash { 0%, 100% { opacity: 0; transform: scale(0.8) translateX(-50%); } 50% { opacity: 1; transform: scale(1.2) translateX(-50%); } }

        /* --- SCROLL PROGRESS HUD --- */
        .hud-line {
            position: fixed; left: 50px; top: 50%; transform: translateY(-50%);
            width: 2px; height: 200px; background: rgba(255,255,255,0.1);
        }
        .hud-progress {
            position: absolute; top: 0; left: 0; width: 100%;
            background: var(--red); box-shadow: 0 0 10px var(--red);
            transition: height 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <canvas id="cursor-web"></canvas>

    <div class="hud-line"><div class="hud-progress" id="progress-bar"></div></div>

    <div class="container" id="main-scroll">
        
        <section id="hero">
            <h1 class="hero-title">BE<br>GREATER</h1>
            <div class="sense-alert">/// SPIDER-SENSE TINGLING ///</div>
        </section>

        <section id="suits">
            <div class="suit-lab">
                <div class="suit-card"><img src="https://gmedia.playstation.com/is/image/SIEPDC/marvels-spider-man-2-screenshot-02-en-01jun23?$native$"></div>
                <div class="suit-card"><img src="https://gmedia.playstation.com/is/image/SIEPDC/marvels-spider-man-miles-morales-screenshot-02-discl-en-02oct20?$native$"></div>
                <div class="suit-card"><img src="https://gmedia.playstation.com/is/image/SIEPDC/marvels-spider-man-screen-08-ps4-us-12jun18?$native$"></div>
                <div class="suit-card"><img src="https://gmedia.playstation.com/is/image/SIEPDC/marvels-spider-man-2-screenshot-13-en-01jun23?$native$"></div>
                <div class="suit-card"><img src="https://gmedia.playstation.com/is/image/SIEPDC/marvels-spider-man-2-screenshot-02-en-01jun23?$native$"></div>
                <div class="suit-card"><img src="https://gmedia.playstation.com/is/image/SIEPDC/marvels-spider-man-miles-morales-screenshot-02-discl-en-02oct20?$native$"></div>
            </div>
        </section>

        <section id="vortex" style="background: radial-gradient(circle, #050510 0%, #000 100%);">
            <div style="text-align: center;">
                <h2 style="font-size: 5rem; letter-spacing: -2px;">THE MULTIVERSE</h2>
                <p style="color: var(--blue); letter-spacing: 10px;">CHRONOLOGICAL ORDER</p>
                <div style="margin-top: 50px; display: flex; flex-direction: column; gap: 20px;">
                    <div class="tl-node">2018 | PETER PARKER</div>
                    <div class="tl-node">2020 | MILES MORALES</div>
                    <div class="tl-node">2023 | THE SYMBIOTE</div>
                </div>
            </div>
        </section>

    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const canvas = document.getElementById('cursor-web');
        const ctx = canvas.getContext('2d');
        const scroller = document.getElementById('main-scroll');
        const progressBar = document.getElementById('progress-bar');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let mouse = { x: 0, y: 0 };
        let lastMouse = { x: 0, y: 0 };

        // 1. CUSTOM CURSOR & WEB TRAIL
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            cursor.style.transform = `translate(${mouse.x - 10}px, ${mouse.y - 10}px)`;
        });

        function drawWeb() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(lastMouse.x, lastMouse.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Ease the "tail" of the web
            lastMouse.x += (mouse.x - lastMouse.x) * 0.1;
            lastMouse.y += (mouse.y - lastMouse.y) * 0.1;

            requestAnimationFrame(drawWeb);
        }
        drawWeb();

        // 2. SCROLL PROGRESS & 3D TILT
        scroller.addEventListener('scroll', () => {
            const scrolled = scroller.scrollTop;
            const max = scroller.scrollHeight - scroller.clientHeight;
            const percent = (scrolled / max) * 100;
            progressBar.style.height = percent + '%';

            // Apply a slight tilt to all sections based on scroll speed
            const sections = document.querySelectorAll('section');
            sections.forEach(s => {
                const speed = 0.05;
                s.style.transform = `rotateX(${(scrolled * speed) % 10}deg)`;
            });
        });

        // 3. SOUND EFFECT (Mechanical Keyboard Style)
        window.addEventListener('mousedown', () => {
            // This replicates the "friendly but mechanical" feel you mentioned
            cursor.style.transform += ' scale(0.5)';
            const audio = new AudioContext();
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.1);
            osc.start();
            osc.stop(audio.currentTime + 0.1);
        });

        window.addEventListener('mouseup', () => {
            cursor.style.transform = cursor.style.transform.replace(' scale(0.5)', '');
        });

    </script>
</body>
</html>
